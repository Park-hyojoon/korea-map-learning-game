<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>한반도 지형 암기 게임 - 강원도 테스트</title>
  <style>
    :root {
      --orange: #ff9418;
      --orange-dark: #bd5100;
      --orange-soft: #fff0da;
      --cream: #fffaf4;
      --ink: #29313d;
      --muted: #6f7885;
      --line: #e4e8ed;
      --green: #37a866;
      --green-soft: #ddf7e7;
      --red: #ef5b5b;
      --red-soft: #ffe3e3;
      --blue: #2fa9df;
      --shadow: 0 8px 0 #e2e6ea, 0 15px 32px rgba(35, 50, 65, 0.08);
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        radial-gradient(circle at 9% 7%, #fff0ca 0 7%, transparent 20%),
        linear-gradient(135deg, #f7fbff, #ffffff 48%, #fff7e9);
      font-family: "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    }

    button { font: inherit; }

    .app {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 30px 0 42px;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--orange-dark);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 42px);
      line-height: 1.2;
      letter-spacing: -.04em;
    }

    .region-badge {
      flex: 0 0 auto;
      padding: 12px 18px;
      border: 2px solid #ffbf72;
      border-radius: 999px;
      background: #fff;
      color: var(--orange-dark);
      font-size: 18px;
      font-weight: 900;
      box-shadow: 0 5px 0 #efddc7;
    }

    .game-grid {
      display: grid;
      grid-template-columns: minmax(290px, .82fr) minmax(420px, 1.28fr);
      gap: 22px;
      align-items: start;
    }

    .panel {
      border: 2px solid var(--line);
      border-radius: 28px;
      background: rgba(255, 255, 255, .94);
      box-shadow: var(--shadow);
    }

    .question-panel {
      position: sticky;
      top: 18px;
      padding: 24px;
    }

    .progress-row,
    .score-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .progress-row {
      margin-bottom: 16px;
      color: var(--muted);
      font-weight: 800;
    }

    .stat-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .score-pill {
      padding: 8px 12px;
      border-radius: 999px;
      background: var(--orange-soft);
      color: var(--orange-dark);
      white-space: nowrap;
    }

    .streak-pill {
      padding: 8px 12px;
      border-radius: 999px;
      background: #e3f5ff;
      color: #147ca9;
      white-space: nowrap;
    }

    .progress-track {
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      border: 1px solid #dfe4e8;
      background: #e8ecef;
      margin-bottom: 24px;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #ffc54b, var(--orange));
      transition: width .35s ease;
    }

    .coach-row {
      display: flex;
      align-items: center;
      gap: 13px;
      margin: 0 0 18px;
    }

    .coach-avatar {
      flex: 0 0 auto;
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border: 3px solid #ffbd68;
      border-radius: 19px;
      background: #fff3d8;
      font-size: 34px;
      box-shadow: 0 4px 0 #edce9e;
    }

    .coach-speech {
      position: relative;
      padding: 11px 14px;
      border: 2px solid #dfe4e8;
      border-radius: 15px;
      background: #fff;
      color: #535e6b;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.35;
    }

    .coach-speech::before {
      content: "";
      position: absolute;
      left: -8px;
      top: 19px;
      width: 12px;
      height: 12px;
      border-left: 2px solid #dfe4e8;
      border-bottom: 2px solid #dfe4e8;
      background: #fff;
      transform: rotate(45deg);
    }

    .question-label {
      margin: 0 0 8px;
      color: var(--orange-dark);
      font-size: 17px;
      font-weight: 900;
    }

    .question-title {
      margin: 0;
      font-size: clamp(23px, 3vw, 31px);
      line-height: 1.35;
      letter-spacing: -.025em;
    }

    .clue-list {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
      margin: 22px 0;
      padding: 0;
      list-style: none;
    }

    .clue-list li {
      padding: 9px 12px;
      border: 2px solid #f2c38c;
      border-radius: 13px;
      background: #fff8ef;
      font-size: 16px;
      font-weight: 800;
      line-height: 1.35;
    }

    .hint-box {
      min-height: 50px;
      margin-bottom: 14px;
      padding: 12px 15px;
      border: 2px dashed #efbc7c;
      border-radius: 14px;
      background: #fffdf9;
      color: var(--orange-dark);
      font-size: 18px;
      font-weight: 900;
      text-align: center;
    }

    .feedback {
      min-height: 74px;
      display: grid;
      place-items: center;
      margin-bottom: 15px;
      padding: 15px;
      border-radius: 16px;
      background: #f7f2ed;
      color: var(--muted);
      font-size: 18px;
      font-weight: 900;
      line-height: 1.45;
      text-align: center;
    }

    .feedback.correct { background: var(--green-soft); color: #176440; }
    .feedback.wrong { background: var(--red-soft); color: #9e3636; }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .action-button {
      min-height: 52px;
      border: 0;
      border-radius: 15px;
      cursor: pointer;
      font-size: 17px;
      font-weight: 900;
      transition: transform .16s ease, box-shadow .16s ease, opacity .16s ease;
    }

    .action-button:hover:not(:disabled) { transform: translateY(-2px); }
    .action-button:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 #b95608; }
    .action-button:focus-visible { outline: 4px solid rgba(232, 121, 36, .25); outline-offset: 2px; }
    .action-button:disabled { cursor: not-allowed; opacity: .45; }

    .hint-button {
      border: 2px solid #efb266;
      background: #fff;
      color: var(--orange-dark);
    }

    .next-button {
      background: linear-gradient(135deg, #f29842, var(--orange));
      color: #fff;
      box-shadow: 0 5px 0 #c75b00;
    }

    .map-panel { padding: 18px; }

    .map-guide {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 2px 4px 15px;
      color: var(--muted);
      font-weight: 800;
    }

    .map-guide strong { color: var(--orange-dark); }

    .zoom-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      width: min(100%, 650px);
      margin: 0 auto 12px;
    }

    .wheel-tip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: #65717e;
      font-size: 14px;
      font-weight: 900;
    }

    .wheel-icon {
      display: grid;
      width: 34px;
      height: 34px;
      place-items: center;
      border: 2px solid #dbe3e9;
      border-radius: 11px;
      background: #fff;
      font-size: 19px;
      box-shadow: 0 3px 0 #dbe3e9;
    }

    .fit-button {
      min-width: 118px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 14px;
      border: 2px solid #ffad49;
      border-radius: 14px;
      background: linear-gradient(135deg, #ffad35, var(--orange));
      color: #fff;
      cursor: pointer;
      font-size: 15px;
      font-weight: 900;
      line-height: 1;
      box-shadow: 0 4px 0 #c75b00;
    }

    .fit-button:hover { transform: translateY(-2px); filter: brightness(1.03); }
    .fit-button:active { transform: translateY(2px); box-shadow: 0 2px 0 #c75b00; }
    .fit-button:focus-visible { outline: 4px solid rgba(47, 169, 223, .24); outline-offset: 2px; }

    .fit-symbol { font-size: 24px; line-height: 1; }

    .zoom-level {
      min-width: 58px;
      color: #55616e;
      font-size: 15px;
      font-weight: 900;
      text-align: center;
    }

    .map-viewport {
      width: min(100%, 650px);
      max-height: 74vh;
      margin: 0 auto;
      overflow: auto;
      border: 4px solid #e3e8ec;
      border-radius: 22px;
      background: #f8f3ec;
      scrollbar-color: #f0a557 #edf0f2;
      scrollbar-width: thin;
      overscroll-behavior: contain;
      touch-action: pan-x pan-y;
      cursor: zoom-in;
    }

    .map-viewport.space-pan-ready {
      cursor: grab !important;
      user-select: none;
    }

    .map-viewport.is-panning {
      cursor: grabbing !important;
      user-select: none;
    }

    .map-stage {
      --zoom: 1;
      position: relative;
      width: calc(var(--zoom) * 100%);
      min-width: 100%;
      line-height: 0;
    }

    .map-image {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .map-image-muted {
      filter: grayscale(1) saturate(0) contrast(.92) brightness(1.05);
      opacity: .78;
    }

    .region-color-layers {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }

    .map-color-layer {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
    }

    .city-point {
      --point-color: var(--orange);
      position: absolute;
      left: calc(var(--x) * 1%);
      top: calc(var(--y) * 1%);
      width: clamp(40px, 7.2vw, 56px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      border: 4px solid #fff;
      border-radius: 50%;
      background: var(--point-color);
      color: #fff;
      cursor: pointer;
      font-size: clamp(18px, 2.7vw, 25px);
      font-weight: 1000;
      line-height: 1;
      box-shadow: 0 4px 0 #a9410b, 0 7px 16px rgba(89, 44, 13, .28);
      transition: transform .16s ease, background .2s ease, box-shadow .2s ease;
      z-index: 2;
    }

    .city-point:hover:not(:disabled) { transform: translate(-50%, -56%) scale(1.08); }
    .city-point:focus-visible { outline: 5px solid rgba(21, 94, 160, .35); outline-offset: 3px; z-index: 5; }
    .city-point:disabled { cursor: default; opacity: 1; }
    .city-point.correct {
      --point-color: var(--green);
      box-shadow: 0 4px 0 #126541, 0 0 0 7px rgba(49, 171, 111, .18);
      z-index: 4;
    }
    .city-point.wrong {
      --point-color: var(--red);
      box-shadow: 0 4px 0 #8c3434, 0 0 0 7px rgba(196, 77, 77, .14);
    }

    .city-name {
      position: absolute;
      left: 50%;
      top: calc(100% + 8px);
      width: max-content;
      max-width: 92px;
      padding: 5px 8px;
      transform: translateX(-50%);
      border-radius: 8px;
      background: rgba(47, 42, 38, .94);
      color: #fff;
      font-size: 13px;
      font-weight: 900;
      line-height: 1.15;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }

    .city-point.reveal .city-name { opacity: 1; }

    .feedback.pop { animation: feedback-pop .32s ease-out; }

    @keyframes feedback-pop {
      0% { transform: scale(.96); }
      70% { transform: scale(1.025); }
      100% { transform: scale(1); }
    }

    .result-card {
      display: none;
      min-height: 420px;
      place-items: center;
      padding: 40px 24px;
      text-align: center;
    }

    .result-card.show { display: grid; }
    .result-emoji { font-size: 68px; line-height: 1; }
    .result-card h2 { margin: 18px 0 10px; font-size: 34px; }
    .result-card p { margin: 0 0 24px; color: var(--muted); font-size: 20px; font-weight: 800; line-height: 1.6; }
    .restart-button { width: min(100%, 260px); }

    .screen-reader-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 850px) {
      .game-grid { grid-template-columns: 1fr; }
      .question-panel { position: static; }
      .map-panel { order: 2; }
    }

    @media (max-width: 560px) {
      .app { width: min(100% - 18px, 1180px); padding-top: 18px; }
      .hero { align-items: flex-start; flex-direction: column; }
      .region-badge { padding: 9px 14px; font-size: 16px; }
      .question-panel, .map-panel { padding: 15px; border-radius: 20px; }
      .controls { grid-template-columns: 1fr; }
      .map-guide { align-items: flex-start; flex-direction: column; font-size: 14px; }
      .zoom-toolbar { justify-content: center; }
      .city-name { font-size: 11px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <div>
        <p class="eyebrow">우리나라 도시 찾기 · 1차 연습판</p>
        <h1>한반도 지형 암기 게임<br>강원도 테스트</h1>
      </div>
      <div class="region-badge" aria-label="현재 권역 강원도">🟧 강원도</div>
    </header>

    <section class="game-grid" id="gameScreen" aria-label="강원도 도시 찾기 게임">
      <aside class="panel question-panel">
        <div class="progress-row">
          <span id="questionNumber">문제 1 / 7</span>
          <div class="stat-group">
            <span class="streak-pill" id="streakDisplay">🔥 0연속</span>
            <span class="score-pill" id="scoreDisplay">⭐ 0점</span>
          </div>
        </div>
        <div class="progress-track" aria-hidden="true">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="coach-row">
          <div class="coach-avatar" aria-hidden="true">🦊</div>
          <div class="coach-speech">특징을 찬찬히 읽고 지도에서 도시를 찾아보자!</div>
        </div>
        <p class="question-label">이 특징에 맞는 도시는?</p>
        <h2 class="question-title">지도에서 알맞은 위치를 눌러 보세요!</h2>
        <ul class="clue-list" id="clueList"></ul>

        <div class="hint-box" id="hintBox" aria-live="polite">초성 힌트가 여기에 나와요</div>
        <div class="feedback" id="feedback" aria-live="assertive">주황색 도시 포인트를 하나 눌러 주세요.</div>

        <div class="controls">
          <button class="action-button hint-button" id="hintButton" type="button">💡 힌트 보기</button>
          <button class="action-button next-button" id="nextButton" type="button" disabled>다음 문제 →</button>
        </div>
      </aside>

      <section class="panel map-panel" aria-label="한반도 지도">
        <div class="map-guide">
          <span><strong>강원도</strong>의 주황색 포인트를 눌러 보세요.</span>
          <span>정답 +1점</span>
        </div>
        <div class="zoom-toolbar" aria-label="지도 확대 및 축소">
          <span class="wheel-tip"><span class="wheel-icon" aria-hidden="true">🖱️</span>휠 확대·축소 · Space+드래그 이동 <span class="zoom-level" id="zoomLevel" aria-live="polite">100%</span></span>
          <button class="fit-button" id="zoomResetButton" type="button" aria-label="지도를 100퍼센트 전체 화면으로 되돌리기"><span class="fit-symbol" aria-hidden="true">⊞</span> 전체 지도</button>
        </div>
        <div class="map-viewport" id="mapViewport">
          <div class="map-stage" id="mapStage">
            <img class="map-image map-image-muted" id="mapImage" src="KakaoTalk_20260829_172706236.jpg" alt="강원도를 제외한 권역은 회색으로 표시한 우리나라 행정 구역 지도">
            <div class="region-color-layers" id="regionColorLayers" aria-hidden="true"></div>
            <div id="cityPoints"></div>
          </div>
        </div>
      </section>
    </section>

    <section class="panel result-card" id="resultScreen" aria-live="polite">
      <div>
        <div class="result-emoji" id="resultEmoji">🎉</div>
        <h2>강원도 연습 완료!</h2>
        <p id="resultText"></p>
        <button class="action-button next-button restart-button" id="restartButton" type="button">다시 도전하기</button>
      </div>
    </section>
  </main>

  <script>
    // 나중에 다른 권역을 추가할 때 이 객체 안에 같은 형식으로 넣으면 됩니다.
    const GAME_REGIONS = {
      gangwon: {
        name: "강원도",
        color: "orange",
        // 원본 지도에서 강원도(주황 권역)를 감싸는 다각형입니다.
        // 다른 권역을 추가할 때도 같은 방식의 polygon 좌표를 넣으면 됩니다.
        mapClip: "polygon(32% 7%, 42% 5%, 54% 5%, 60% 0%, 66% 1%, 70% 7%, 72% 16%, 76% 22%, 83% 29%, 83% 32%, 72% 32%, 65% 30%, 58% 29%, 53% 30%, 48% 29%, 43% 30%, 40% 28%, 42% 24%, 41% 20%, 39% 17%, 36% 13%, 32% 10%)",
        mapFocus: { x: .61, y: .22, zoom: 2.15 },
        cities: [
          {
            city: "춘천",
            initials: "ㅊㅊ",
            clues: ["강원도 도청 소재지", "닭갈비와 막국수", "호반의 도시", "서울과 지하철 연결", "남이섬"],
            x: 47.8,
            y: 15.5
          },
          {
            city: "강릉",
            initials: "ㄱㄹ",
            clues: ["해안 도시", "경포호와 오죽헌", "초당순두부와 닭강정", "커피거리와 단오제", "드라마 도깨비 촬영지"],
            x: 71.7,
            y: 21.0
          },
          {
            city: "평창",
            initials: "ㅍㅊ",
            clues: ["동계올림픽", "고위평탄면", "삼양목장과 대관령", "스키장", "다우지·다설지와 풍력발전"],
            x: 62.4,
            y: 24.5
          },
          {
            city: "원주",
            initials: "ㅇㅈ",
            clues: ["강원도 인구 1위", "의료기기클러스터", "건강보험관리공단", "혁신 도시", "치악산과 뮤지엄 산"],
            x: 52.2,
            y: 27.1
          },
          {
            city: "삼척",
            initials: "ㅅㅊ",
            clues: ["무연탄", "카르스트지형", "석회동굴", "한국의 나폴리 장호항"],
            x: 76.2,
            y: 28.2
          },
          {
            city: "영월",
            initials: "ㅇㅇ",
            clues: ["동강 래프팅", "카르스트지형", "시멘트 공업"],
            x: 62.3,
            y: 29.5
          },
          {
            city: "태백",
            initials: "ㅌㅂ",
            clues: ["무연탄과 석탄박물관", "카르스트지형", "낙동강과 한강의 발원지", "꽃 축제"],
            x: 73.5,
            y: 31.4
          }
        ]
      }
    };

    const activeRegionKey = "gangwon";
    const completedRegionKeys = new Set();
    const activeRegion = GAME_REGIONS[activeRegionKey];
    const cities = activeRegion.cities;

    const elements = {
      gameScreen: document.getElementById("gameScreen"),
      resultScreen: document.getElementById("resultScreen"),
      questionNumber: document.getElementById("questionNumber"),
      scoreDisplay: document.getElementById("scoreDisplay"),
      streakDisplay: document.getElementById("streakDisplay"),
      progressFill: document.getElementById("progressFill"),
      clueList: document.getElementById("clueList"),
      hintBox: document.getElementById("hintBox"),
      feedback: document.getElementById("feedback"),
      hintButton: document.getElementById("hintButton"),
      nextButton: document.getElementById("nextButton"),
      cityPoints: document.getElementById("cityPoints"),
      regionColorLayers: document.getElementById("regionColorLayers"),
      mapViewport: document.getElementById("mapViewport"),
      mapStage: document.getElementById("mapStage"),
      zoomResetButton: document.getElementById("zoomResetButton"),
      zoomLevel: document.getElementById("zoomLevel"),
      resultText: document.getElementById("resultText"),
      resultEmoji: document.getElementById("resultEmoji"),
      restartButton: document.getElementById("restartButton"),
      mapImage: document.getElementById("mapImage")
    };

    let questionOrder = [];
    let currentIndex = 0;
    let score = 0;
    let streak = 0;
    let bestStreak = 0;
    let answered = false;
    let mapZoom = 1;
    let spacePressed = false;
    let isPanning = false;
    let panPointerId = null;
    let panStartX = 0;
    let panStartY = 0;
    let panStartScrollLeft = 0;
    let panStartScrollTop = 0;
    let panMoved = false;

    const MIN_ZOOM = 1;
    const MAX_ZOOM = 2.5;
    const WHEEL_ZOOM_STEP = .15;

    function shuffle(items) {
      const copied = [...items];
      for (let i = copied.length - 1; i > 0; i -= 1) {
        const j = Math.floor(Math.random() * (i + 1));
        [copied[i], copied[j]] = [copied[j], copied[i]];
      }
      return copied;
    }

    function makePoint(cityData) {
      const button = document.createElement("button");
      button.className = "city-point";
      button.type = "button";
      button.dataset.city = cityData.city;
      button.style.setProperty("--x", cityData.x);
      button.style.setProperty("--y", cityData.y);
      button.setAttribute("aria-label", `${cityData.city} 위치 선택`);
      button.innerHTML = `<span aria-hidden="true">?</span><span class="city-name">${cityData.city}</span>`;
      button.addEventListener("click", () => checkAnswer(cityData.city));
      return button;
    }

    function renderPoints() {
      elements.cityPoints.replaceChildren(...cities.map(makePoint));
    }

    function renderRegionColors() {
      const visibleRegionKeys = new Set([...completedRegionKeys, activeRegionKey]);
      const layers = [...visibleRegionKeys].map((regionKey) => {
        const region = GAME_REGIONS[regionKey];
        if (!region?.mapClip) return null;
        const image = document.createElement("img");
        image.className = "map-color-layer";
        image.src = "KakaoTalk_20260829_172706236.jpg";
        image.alt = "";
        image.style.clipPath = region.mapClip;
        return image;
      }).filter(Boolean);
      elements.regionColorLayers.replaceChildren(...layers);
    }

    function setMapZoom(nextZoom, resetPosition = false, anchor = null) {
      const oldZoom = mapZoom;
      const viewport = elements.mapViewport;
      const anchorX = anchor?.x ?? (viewport.clientWidth / 2);
      const anchorY = anchor?.y ?? (viewport.clientHeight / 2);
      const mapX = viewport.scrollLeft + anchorX;
      const mapY = viewport.scrollTop + anchorY;

      mapZoom = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, nextZoom));
      elements.mapStage.style.setProperty("--zoom", mapZoom);
      elements.zoomLevel.textContent = `${Math.round(mapZoom * 100)}%`;
      viewport.style.cursor = mapZoom >= MAX_ZOOM ? "zoom-out" : "zoom-in";
      viewport.classList.toggle("space-pan-ready", spacePressed && mapZoom > MIN_ZOOM);
      if (mapZoom <= MIN_ZOOM && isPanning) finishMapPan();

      requestAnimationFrame(() => {
        if (resetPosition || mapZoom === MIN_ZOOM) {
          viewport.scrollTo({ left: 0, top: 0, behavior: "smooth" });
          return;
        }
        const ratio = mapZoom / oldZoom;
        viewport.scrollTo({
          left: (mapX * ratio) - anchorX,
          top: (mapY * ratio) - anchorY,
          behavior: anchor ? "auto" : "smooth"
        });
      });
    }

    function handleMapWheel(event) {
      event.preventDefault();
      const direction = event.deltaY < 0 ? 1 : -1;
      const nextZoom = Math.round((mapZoom + (direction * WHEEL_ZOOM_STEP)) * 100) / 100;
      const bounds = elements.mapViewport.getBoundingClientRect();
      setMapZoom(nextZoom, false, {
        x: event.clientX - bounds.left,
        y: event.clientY - bounds.top
      });
    }

    function handleSpaceDown(event) {
      const isTyping = event.target instanceof HTMLElement && event.target.matches("input, textarea, select, [contenteditable='true']");
      if (event.code !== "Space" || isTyping || mapZoom <= MIN_ZOOM) return;
      event.preventDefault();
      spacePressed = true;
      elements.mapViewport.classList.add("space-pan-ready");
    }

    function finishMapPan() {
      if (!isPanning) return;
      isPanning = false;
      elements.mapViewport.classList.remove("is-panning");
      if (panPointerId !== null && elements.mapViewport.hasPointerCapture(panPointerId)) {
        elements.mapViewport.releasePointerCapture(panPointerId);
      }
      panPointerId = null;
      window.setTimeout(() => { panMoved = false; }, 0);
    }

    function handleSpaceUp(event) {
      if (event.code !== "Space") return;
      if (spacePressed) event.preventDefault();
      spacePressed = false;
      elements.mapViewport.classList.remove("space-pan-ready");
      finishMapPan();
    }

    function startMapPan(event) {
      if (!spacePressed || mapZoom <= MIN_ZOOM || event.button !== 0) return;
      event.preventDefault();
      isPanning = true;
      panMoved = false;
      panPointerId = event.pointerId;
      panStartX = event.clientX;
      panStartY = event.clientY;
      panStartScrollLeft = elements.mapViewport.scrollLeft;
      panStartScrollTop = elements.mapViewport.scrollTop;
      elements.mapViewport.classList.add("is-panning");
      elements.mapViewport.setPointerCapture(event.pointerId);
    }

    function moveMapPan(event) {
      if (!isPanning || event.pointerId !== panPointerId) return;
      const movedX = event.clientX - panStartX;
      const movedY = event.clientY - panStartY;
      if (Math.abs(movedX) > 3 || Math.abs(movedY) > 3) panMoved = true;
      elements.mapViewport.scrollLeft = panStartScrollLeft - movedX;
      elements.mapViewport.scrollTop = panStartScrollTop - movedY;
    }

    function preventClickAfterPan(event) {
      if (!panMoved) return;
      event.preventDefault();
      event.stopPropagation();
      panMoved = false;
    }

    function resetPoints() {
      document.querySelectorAll(".city-point").forEach((point) => {
        point.disabled = false;
        point.classList.remove("correct", "wrong", "reveal");
        point.querySelector("span[aria-hidden='true']").textContent = "?";
      });
    }

    function renderQuestion() {
      const currentCity = questionOrder[currentIndex];
      answered = false;
      resetPoints();

      elements.questionNumber.textContent = `문제 ${currentIndex + 1} / ${questionOrder.length}`;
      elements.scoreDisplay.textContent = `⭐ ${score}점`;
      elements.streakDisplay.textContent = `🔥 ${streak}연속`;
      elements.progressFill.style.width = `${((currentIndex + 1) / questionOrder.length) * 100}%`;
      elements.clueList.replaceChildren(...currentCity.clues.map((clue) => {
        const item = document.createElement("li");
        item.textContent = clue;
        return item;
      }));
      elements.hintBox.textContent = "초성 힌트가 여기에 나와요";
      elements.feedback.className = "feedback";
      elements.feedback.textContent = "주황색 도시 포인트를 하나 눌러 주세요.";
      elements.hintButton.disabled = false;
      elements.hintButton.textContent = "💡 힌트 보기";
      elements.nextButton.disabled = true;
      elements.nextButton.textContent = currentIndex === questionOrder.length - 1 ? "결과 보기 →" : "다음 문제 →";
    }

    function checkAnswer(selectedCity) {
      if (answered) return;
      answered = true;

      const answer = questionOrder[currentIndex];
      const isCorrect = selectedCity === answer.city;
      const selectedPoint = document.querySelector(`[data-city="${selectedCity}"]`);
      const answerPoint = document.querySelector(`[data-city="${answer.city}"]`);

      document.querySelectorAll(".city-point").forEach((point) => { point.disabled = true; });
      answerPoint.classList.add("correct", "reveal");
      answerPoint.querySelector("span[aria-hidden='true']").textContent = "✓";

      if (isCorrect) {
        score += 1;
        streak += 1;
        bestStreak = Math.max(bestStreak, streak);
        elements.feedback.className = "feedback correct pop";
        elements.feedback.textContent = streak >= 2 ? `정답입니다! ${answer.city} · ${streak}문제 연속 성공!` : `정답입니다! ${answer.city}`;
      } else {
        streak = 0;
        selectedPoint.classList.add("wrong", "reveal");
        selectedPoint.querySelector("span[aria-hidden='true']").textContent = "×";
        elements.feedback.className = "feedback wrong pop";
        elements.feedback.textContent = `아쉽습니다. 정답은 ${answer.city}입니다.`;
      }

      elements.scoreDisplay.textContent = `⭐ ${score}점`;
      elements.streakDisplay.textContent = `🔥 ${streak}연속`;
      elements.hintButton.disabled = true;
      elements.nextButton.disabled = false;
      elements.nextButton.focus();
    }

    function showHint() {
      if (answered) return;
      const answer = questionOrder[currentIndex];
      elements.hintBox.textContent = `초성 힌트: ${answer.initials}`;
      elements.hintButton.textContent = "힌트 확인 완료";
      elements.hintButton.disabled = true;
    }

    function showResult() {
      elements.gameScreen.hidden = true;
      elements.resultScreen.classList.add("show");

      const percent = Math.round((score / questionOrder.length) * 100);
      if (percent === 100) {
        elements.resultEmoji.textContent = "🏆";
        elements.resultText.innerHTML = `<strong>${score}점 / ${questionOrder.length}점</strong><br>완벽해요! 강원도 도시 박사예요.<br>최고 연속 정답: ${bestStreak}문제`;
      } else if (percent >= 70) {
        elements.resultEmoji.textContent = "🎉";
        elements.resultText.innerHTML = `<strong>${score}점 / ${questionOrder.length}점</strong><br>아주 잘했어요! 한 번 더 하면 완벽해요.<br>최고 연속 정답: ${bestStreak}문제`;
      } else {
        elements.resultEmoji.textContent = "💪";
        elements.resultText.innerHTML = `<strong>${score}점 / ${questionOrder.length}점</strong><br>괜찮아요. 다시 풀며 위치를 익혀 봐요.<br>최고 연속 정답: ${bestStreak}문제`;
      }
      elements.restartButton.focus();
    }

    function nextQuestion() {
      if (!answered) return;
      if (currentIndex >= questionOrder.length - 1) {
        showResult();
        return;
      }
      currentIndex += 1;
      renderQuestion();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function startGame() {
      questionOrder = shuffle(cities);
      currentIndex = 0;
      score = 0;
      streak = 0;
      bestStreak = 0;
      answered = false;
      elements.gameScreen.hidden = false;
      elements.resultScreen.classList.remove("show");
      renderQuestion();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    elements.hintButton.addEventListener("click", showHint);
    elements.nextButton.addEventListener("click", nextQuestion);
    elements.restartButton.addEventListener("click", startGame);
    elements.zoomResetButton.addEventListener("click", () => setMapZoom(MIN_ZOOM, true));
    elements.mapViewport.addEventListener("wheel", handleMapWheel, { passive: false });
    document.addEventListener("keydown", handleSpaceDown);
    document.addEventListener("keyup", handleSpaceUp);
    window.addEventListener("blur", () => {
      spacePressed = false;
      elements.mapViewport.classList.remove("space-pan-ready");
      finishMapPan();
    });
    elements.mapViewport.addEventListener("pointerdown", startMapPan);
    elements.mapViewport.addEventListener("pointermove", moveMapPan);
    elements.mapViewport.addEventListener("pointerup", finishMapPan);
    elements.mapViewport.addEventListener("pointercancel", finishMapPan);
    elements.mapViewport.addEventListener("lostpointercapture", finishMapPan);
    elements.mapViewport.addEventListener("click", preventClickAfterPan, true);
    elements.mapImage.addEventListener("error", () => {
      elements.feedback.className = "feedback wrong";
      elements.feedback.textContent = "지도 이미지를 찾을 수 없습니다. HTML과 지도 JPG를 같은 폴더에 두어 주세요.";
    });

    renderRegionColors();
    renderPoints();
    setMapZoom(MIN_ZOOM, true);
    startGame();
  </script>
</body>
</html>
